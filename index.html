const C6=String.raw`/* Experiment 6: Infix to Postfix Conversion and Evaluation using Stack
   Operators: + - *   Operands: single characters (digits for evaluation) */
#include <stdio.h>

#define MAX 50

int stack[MAX];     /* one array-based stack used by both operations */
int top = -1;
char infix[MAX];
char postfix[MAX];

/* Function declarations */
void push(int x);
int pop(void);
int precedence(char c);
int isOperand(char c);
void readInfix(void);
void infixToPostfix(void);
void evaluatePostfix(void);

void push(int x)
{
    if (top == MAX - 1)
    {
        printf("\nStack Overflow");
        return;
    }
    top++;
    stack[top] = x;
}

int pop(void)
{
    int x;
    if (top == -1)
    {
        printf("\nStack Underflow");
        return 0;
    }
    x = stack[top];
    top--;
    return x;
}

/* Higher number = higher priority */
int precedence(char c)
{
    if (c == '*')
        return 2;
    if (c == '+' || c == '-')
        return 1;
    return 0;      /* for '(' */
}

/* An operand is a single letter or digit */
int isOperand(char c)
{
    if ((c >= '0' && c <= '9') || (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z'))
        return 1;
    return 0;
}

void readInfix(void)
{
    printf("Enter infix expression (no spaces, e.g. (2+3)*4): ");
    scanf("%49s", infix);
    postfix[0] = '\0';      /* old postfix is no longer valid */
}

void infixToPostfix(void)
{
    int i, k = 0;
    char ch;

    if (infix[0] == '\0')
    {
        printf("Please enter an infix expression first (option 1).");
        return;
    }
    top = -1;
    for (i = 0; infix[i] != '\0'; i++)
    {
        ch = infix[i];
        if (isOperand(ch))
            postfix[k++] = ch;                 /* operand goes directly to output */
        else if (ch == '(')
            push(ch);
        else if (ch == ')')
        {
            /* pop until '(' is found */
            while (top != -1 && stack[top] != '(')
                postfix[k++] = pop();
            if (top == -1)
            {
                printf("Invalid expression: ')' without matching '('.");
                postfix[0] = '\0';
                return;
            }
            pop();                             /* remove '(' */
        }
        else if (ch == '+' || ch == '-' || ch == '*')
        {
            /* pop operators of higher or equal priority first */
            while (top != -1 && precedence(stack[top]) >= precedence(ch))
                postfix[k++] = pop();
            push(ch);
        }
        else
        {
            printf("Invalid character '%c' in expression.", ch);
            postfix[0] = '\0';
            return;
        }
    }
    /* pop the remaining operators */
    while (top != -1)
    {
        if (stack[top] == '(')
        {
            printf("Invalid expression: '(' without matching ')'.");
            postfix[0] = '\0';
            return;
        }
        postfix[k++] = pop();
    }
    postfix[k] = '\0';
    printf("Postfix expression: %s", postfix);
}

void evaluatePostfix(void)
{
    int i, a, b, result;
    char ch;

    if (postfix[0] == '\0')
    {
        printf("Please convert a valid infix expression first (option 2).");
        return;
    }
    top = -1;
    for (i = 0; postfix[i] != '\0'; i++)
    {
        ch = postfix[i];
        if (ch >= '0' && ch <= '9')
            push(ch - '0');                    /* digit character -> number */
        else if (ch == '+' || ch == '-' || ch == '*')
        {
            if (top < 1)                       /* need two operands */
            {
                printf("Invalid expression: operator without two operands.");
                return;
            }
            b = pop();                         /* second operand comes out first */
            a = pop();
            if (ch == '+')
                result = a + b;
            else if (ch == '-')
                result = a - b;
            else
                result = a * b;
            push(result);
        }
        else
        {
            printf("Cannot evaluate: '%c' is not a digit (use digits 0-9 only).", ch);
            return;
        }
    }
    if (top != 0)
    {
        printf("Invalid expression: operands left over.");
        return;
    }
    printf("Result = %d", pop());
}

int main()
{
    int choice;

    do
    {
        printf("\n\n----- INFIX / POSTFIX MENU -----");
        printf("\n1. Enter infix expression");
        printf("\n2. Convert to postfix");
        printf("\n3. Evaluate postfix");
        printf("\n4. Exit");
        printf("\nEnter your choice: ");
        scanf("%d", &choice);

        switch (choice)
        {
            case 1:
                readInfix();
                break;
            case 2:
                infixToPostfix();
                break;
            case 3:
                evaluatePostfix();
                break;
            case 4:
                printf("Exiting...");
                break;
            default:
                printf("Invalid choice!");
        }
    } while (choice != 4);

    return 0;
}

struct node
{
    int data;

    struct node* right;
};
struct node* createnode(int value)
{
    struct node* newnode;
    newnode = (struct node*)malloc(sizeof(struct node));

    newnode->data = value;
    newnode->left = newnode->right = NULL;

    return newnode;
}
struct node* insert(struct node* root, int value)
{
    if(root == NULL)
        return createnode(value);

    if(value < root->data)
        root->left = insert(root->left, value);

    else
        root->right = insert(root->right, value);

    return root;
}
void inorder(struct node *root)
{
    if(root != NULL)
    {
        inorder(root->left);
        printf("%d ", root->data);
        inorder(root->right);
    }
}
int height(struct node *root)
{
    if(root == NULL)
        return 0;

    int lheight = height(root->left);
    int rheight = height(root->right);

    if(lheight > rheight || lheight == rheight)
        return lheight+1;
    else
        return rheight+1;
}
int min(struct node *root)
{
    while(root->left != NULL)
    {
        root = root->left;
    }
    return root->data;
}
void mirror(struct node *root)
{
    if(root == NULL)
        return;
    struct node* temp = root->left;
    root->left = root->right;
    root->right = temp;
    mirror(root->left);
    mirror(root->right);
}
void search(struct node *root,int key)
{
    if(root == NULL)
        printf("Value not found");
        return;
    if(key == root->data)
        printf("Value found");
        return;
    if(key < root->data)
    {
        search(root->left, key);
    }
    else
    {
        search(root->right, key);
    }
}

    for (i = 0; i < e; i++)
    {
        printf("\nFlight %d - enter city number 1, city number 2 and cost: ", i + 1);
        scanf("%d %d %d", &u, &v, &cost);
        if (u < 1 || u > n || v < 1 || v > n || u == v || cost <= 0)
        {
            printf("Invalid flight! Enter it again.");
            i--;                       /* repeat this flight */
        }
        else
        {
            adj[u - 1][v - 1] = cost;  /* flight is two-way (undirected graph) */
            adj[v - 1][u - 1] = cost;
        }
    }
    printf("\nGraph created.");
}

void displayMatrix(void)
{
    int i, j;

    if (n == 0)
    {
        printf("Graph is not created yet. Use option 1.");
        return;
    }
    printf("Adjacency Matrix (0 = no flight):\n");
    printf("%-10s", "");
    for (i = 0; i < n; i++)
        printf("%-10s", city[i]);
    for (i = 0; i < n; i++)
    {
        printf("\n%-10s", city[i]);
        for (j = 0; j < n; j++)
            printf("%-10d", adj[i][j]);
    }
}

/* BFS from city 0. If all n cities get visited, the graph is connected. */
void checkConnected(void)
{
    int visited[MAX], queue[MAX];
    int front = 0, rear = 0, count = 0;
    int i, v;

    if (n == 0)
    {
        printf("Graph is not created yet. Use option 1.");
        return;
    }
    for (i = 0; i < n; i++)
        visited[i] = 0;

    visited[0] = 1;            /* start BFS from the first city */
    queue[rear] = 0;
    rear++;
    count = 1;

    printf("BFS order: ");
    while (front < rear)
    {
        v = queue[front];      /* take a city from the queue */
        front++;
        printf("%s ", city[v]);
        for (i = 0; i < n; i++)
        {
            if (adj[v][i] != 0 && visited[i] == 0)   /* flight exists, city not visited */
            {
                visited[i] = 1;
                queue[rear] = i;
                rear++;
                count++;
            }
        }
    }

    if (count == n)
        printf("\nGraph is CONNECTED (all %d cities reached).", n);
    else
    {
        printf("\nGraph is NOT connected. Cities not reached: ");
        for (i = 0; i < n; i++)
            if (visited[i] == 0)
                printf("%s ", city[i]);
    }
}

int main()
{
    int choice;

    do
    {
        printf("\n\n----- FLIGHT GRAPH MENU -----");
        printf("\n1. Create graph (cities and flights)");
        printf("\n2. Display adjacency matrix");
        printf("\n3. Check whether graph is connected (BFS)");
        printf("\n4. Exit");
        printf("\nEnter your choice: ");
        scanf("%d", &choice);

        switch (choice)
        {
            case 1:
                createGraph();
                break;
            case 2:
                displayMatrix();
                break;
            case 3:
                checkConnected();
                break;
            case 4:
                printf("Exiting...");
                break;
            default:
                printf("Invalid choice!");
        }
    } while (choice != 4);

    return 0;
}
